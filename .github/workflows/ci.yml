name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # On pull_request events actions/checkout builds the synthetic merge commit
      # (refs/pull/N/merge), which tests the branch as it would land on the base branch.
      # Keep that, and print every relevant hash so the built commit can be compared
      # with the PR branch HEAD. The merge commit's second parent is the PR head.
      - name: Show built commit hashes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "event:                  $EVENT_NAME"
          echo "github.ref:             $GITHUB_REF_VALUE"
          echo "github.sha:             $GITHUB_SHA_VALUE"
          echo "git rev-parse HEAD:     $(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pull_request.head.sha:  $PR_HEAD_SHA"
            echo "pull_request.base.sha:  $PR_BASE_SHA"
            echo "built commit parents:   $(git cat-file -p HEAD | sed -n 's/^parent //p' | tr '\n' ' ')"
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify full Maven reactor
        run: mvn -B -ntp clean verify
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
      - name: Upload shaded JARs
        uses: actions/upload-artifact@v4
        with:
          name: miniq-build-jars
          path: |
            miniq-server/target/miniq-server.jar
            miniq-chaos/target/miniq-chaos.jar
          if-no-files-found: error
