name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify full Maven reactor
        run: mvn -B -ntp clean verify
      - name: Check release JARs
        run: |
          test -f miniq-server/target/miniq-server.jar || { echo 'Missing miniq-server/target/miniq-server.jar' >&2; exit 1; }
          test -f miniq-chaos/target/miniq-chaos.jar || { echo 'Missing miniq-chaos/target/miniq-chaos.jar' >&2; exit 1; }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            miniq-server/target/miniq-server.jar
            miniq-chaos/target/miniq-chaos.jar
